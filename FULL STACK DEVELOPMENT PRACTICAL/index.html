<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">My To-Do List</span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-1">Task Manager</h2>
                    <p class="text-center text-muted mb-4">Organize your tasks and stay productive.</p>

                    <div class="input-group mb-3">
                        <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
                        <button class="btn btn-primary" id="addBtn" type="button">Add Task</button>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-bold">Your tasks</span>
                        <span class="badge bg-primary" id="taskCounter">0 remaining</span>
                    </div>

                    <div class="btn-group w-100 mb-3" role="group">
                        <button type="button" class="btn btn-outline-primary active" id="filterAll">All</button>
                        <button type="button" class="btn btn-outline-primary" id="filterActive">Active</button>
                        <button type="button" class="btn btn-outline-primary" id="filterCompleted">Completed</button>
                    </div>

                    <ul id="taskList" class="list-group mb-3">
                    </ul>

                    <div class="text-end">
                        <button class="btn btn-outline-danger btn-sm" id="clearCompletedBtn">Clear Completed</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center mt-5 text-muted">
        <small>Full-Stack Development Practical</small>
    </footer>

    <script src="script.js"></script>
</body>
</html>
